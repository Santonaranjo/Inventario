services:
  db:
    image: postgres:16
    container_name: inventario-db
    environment:
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario
      POSTGRES_DB: inventario
    ports:
      # Puerto en Windows configurable con DB_PORT en .env (si el 5432 ya lo usa otro PostgreSQL).
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario -d inventario"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: inventario-api
    env_file: .env
    environment:
      # Dentro de Docker el host de Postgres es el servicio "db".
      DATABASE_URL: postgresql+psycopg://inventario:inventario@db:5432/inventario
      TEST_DATABASE_URL: postgresql+psycopg://inventario:inventario@db:5432/inventario_test
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        # URL con la que el NAVEGADOR llama a la API (se incrusta al construir la imagen).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: inventario-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
